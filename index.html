<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>lvlv</title>
<style>
:root{--bg:#f1ebdd;--paper:#fbf7ee;--ink:#3a342c;--mut:#8b8274;--ln:#d9cfbd;--ac:#8a6a45;--tape:rgba(190,160,110,.55)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg) radial-gradient(#0000000d 1px,transparent 1px) 0 0/18px 18px;color:var(--ink);font:15px/1.6 "Noto Serif KR","Nanum Myeongjo",Batang,Georgia,serif}
button,input,select,textarea{font:inherit;color:inherit;background:var(--paper);border:1px solid var(--ln);border-radius:4px;padding:5px 9px}
button{cursor:pointer}button:hover{border-color:var(--ac)}.p{background:var(--ac);color:#fff;border-color:var(--ac)}
textarea{width:100%;resize:vertical}[hidden]{display:none!important}.mut,small{color:var(--mut)}
#login{max-width:300px;margin:18vh auto;display:grid;gap:8px;padding:0 14px}
#app{display:grid;grid-template-columns:270px 1fr;height:100%}
#list{border-right:1px dashed var(--ln);display:flex;flex-direction:column;min-height:0;padding:12px;gap:8px}
#list h1{margin:0;font-size:21px;letter-spacing:2px;display:flex;gap:6px;align-items:center}#list h1 span{flex:1}
#cl{overflow:auto;flex:1}
.ci{display:flex;gap:10px;align-items:center;padding:7px;border-radius:6px;cursor:pointer}.ci:hover,.ci.on{background:#e9dfc9}
.th{width:44px;height:44px;border-radius:50%;background:#ddd2bb center/cover;flex:none;border:2px solid #fff;box-shadow:0 1px 3px #0003}
#det{overflow:auto;padding:18px 24px;min-width:0}.bk{display:none;margin-bottom:8px}
.hd{display:flex;gap:8px}.nm{font-size:22px;font-weight:600;flex:1;background:none;border-color:transparent;border-bottom:1px dashed var(--ln)}
.row{display:flex;gap:8px;margin:8px 0}.row input{flex:1}.kw{width:100%}
.card{background:var(--paper);border:1px solid var(--ln);border-radius:3px;padding:12px 14px;margin:0 0 10px;box-shadow:0 1px 2px #0001}
.card p{margin:4px 0;white-space:pre-wrap}.tg span{display:inline-block;background:#e9dfc9;border-radius:10px;padding:0 8px;margin:4px 4px 0 0;font-size:12px}
.ac{margin-top:6px;display:flex;gap:6px}.ac button{font-size:12px;padding:2px 8px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px}.btn{display:inline-block;border:1px solid var(--ln);border-radius:4px;padding:5px 9px;background:var(--paper);cursor:pointer}
.tray{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:4px 0;white-space:nowrap}.tt{height:40px;border:2px solid #fff;box-shadow:0 1px 3px #0003;cursor:pointer}
.tb{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}
.it{position:absolute;touch-action:none;user-select:none;cursor:grab;box-shadow:0 3px 8px #0004}.it.sel{outline:2px dashed var(--ac);outline-offset:3px}
.it.i{background:#fff;padding:7px 7px 22px}.it.i img{width:100%;display:block;pointer-events:none}
.it.q,.it.t{padding:12px 14px;background:#fff3bd}.it.t.c1,.it.q.c1{background:#dcebd6}.it.t.c2,.it.q.c2{background:#f6d9d9}
.it p{margin:0;white-space:pre-wrap;min-height:1.4em;outline:0}.it small{display:block;margin-top:6px}
.rz{position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;background:var(--ac);border-radius:50%;cursor:nwse-resize;display:none}.it.sel .rz{display:block}
h2.nm{margin:0;border:0}.th{display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--ac)}
.ti{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--ln);background:var(--paper);border-radius:4px;padding:4px 8px;margin:8px 0;cursor:text}
.ti input{border:0;outline:0;flex:1;min-width:130px;padding:3px}.chip{background:#e9dfc9;border-radius:12px;padding:0 4px 0 10px;font-size:13px}.chip b{cursor:pointer;color:var(--mut);padding:0 4px}
.star{position:absolute;top:2px;right:6px;color:#c9962e;font-size:18px;text-shadow:0 0 3px #fff}
.sbn{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}#sbw{width:100%}.sb{display:flex;justify-content:center}
.pg{position:relative;overflow:hidden;flex:none;background:var(--paper) radial-gradient(#8a6a4522 1px,transparent 1px) 0 0/22px 22px;box-shadow:0 2px 10px #0003}
.pg.blank{background:none;box-shadow:none;border:1px dashed var(--ln)}.pgi{position:absolute;left:0;top:0;width:600px;height:840px;transform-origin:0 0}
.pg.l{border-radius:3px 0 0 3px}.pg.r{border-radius:0 3px 3px 0}
.pg.l:after,.pg.r:after{content:"";position:absolute;top:0;bottom:0;width:22px;pointer-events:none}
.pg.l:after{right:0;background:linear-gradient(90deg,transparent,#0000001f)}.pg.r:after{left:0;background:linear-gradient(270deg,transparent,#0000001f)}
.nn{font-size:22px;font-weight:600;flex:1}summary{cursor:pointer}
.ml,.tl{display:flex;flex-wrap:wrap;gap:8px;max-height:150px;overflow:auto;padding:4px}
.mi{position:relative;width:64px;height:64px;border:2px solid #fff;box-shadow:0 1px 3px #0004;cursor:pointer;flex:none;background:#ddd}.mi img{width:100%;height:100%;object-fit:cover;display:block}
.ad{position:absolute;right:2px;bottom:2px;width:20px;height:20px;border-radius:50%;background:var(--ac);color:#fff;font-style:normal;text-align:center;line-height:20px;cursor:pointer;font-size:14px}
.tx2{position:relative;width:150px;height:84px;background:#fff3bd;padding:6px 8px;box-shadow:0 1px 3px #0003;cursor:pointer;overflow:hidden;font-size:12px;line-height:1.4;flex:none}
.tx2 small{display:block}.tx2 p{margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.tx2.k-look{background:#dcebd6}.tx2.k-profile{background:#f6d9d9}
.fp{position:relative;width:100%;height:100%;font-size:14px}.fp>*{position:absolute}
.fp-ph{left:36px;top:40px;width:230px;padding:10px 10px 28px;background:#fff;box-shadow:0 3px 8px #0004;transform:rotate(-3deg)}
.fp-ph:before{content:"";position:absolute;top:-10px;left:50%;width:56px;height:18px;margin-left:-28px;background:var(--tape);transform:rotate(-3deg)}
.fp-ph img,.fp-ph span{width:100%;height:210px;display:flex;object-fit:cover;align-items:center;justify-content:center;color:var(--mut);background:#eee}.fp-ph img{cursor:zoom-in;background:none}
.fp h2{left:296px;top:56px;width:270px;margin:0;font-size:34px;line-height:1.15}.fp-o{left:296px;top:140px;width:270px;color:var(--mut)}
.fp-k{left:296px;top:176px;width:270px}.fp-k .tg span{font-size:13px}.tg.lk span{background:none;border:1px solid var(--ac)}
.fp-c{padding:10px 14px;box-shadow:0 3px 8px #0003;cursor:pointer;overflow:hidden}.fp-c small{display:block;color:var(--mut);margin-bottom:4px;letter-spacing:2px}
.fp-c p{margin:0;white-space:pre-wrap;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;-webkit-line-clamp:7}
.fp-c.b{left:36px;top:360px;width:528px;height:170px;background:#fff3bd;transform:rotate(.8deg);font-style:italic}.fp-c.b p{-webkit-line-clamp:5}
.fp-c.c{left:36px;top:560px;width:528px;height:236px;background:#f6d9d9;transform:rotate(-.4deg)}.fp-c.c p{-webkit-line-clamp:9}
.tl-t{margin:8px 0 2px;font-size:13px;color:var(--mut)}.chip.new{outline:1px dashed var(--ac)}
#cr{max-width:min(94vw,820px)}#cr-box{position:relative;width:fit-content;margin:10px auto;touch-action:none;user-select:none}#cr-img{max-width:min(88vw,780px);max-height:60vh;display:block}
#cr-sel{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px #0008;cursor:move}#cr-rz{position:absolute;right:-9px;bottom:-9px;width:16px;height:16px;border-radius:50%;background:var(--ac);border:2px solid #fff;cursor:nwse-resize}
.sb:not(.ed) .it{cursor:default}.sb:not(.ed) .it.i{cursor:zoom-in}
dialog{border:1px solid var(--ln);border-radius:6px;background:var(--paper);color:var(--ink);padding:18px;max-width:min(560px,94vw);width:100%}
dialog::backdrop{background:#0006}dialog form{display:grid;gap:8px}dialog h3{margin:0 0 8px}
#lb{max-width:94vw;width:auto;text-align:center}#lb img{max-width:90vw;max-height:78vh;display:block;margin:0 auto 8px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#3a342c;color:#fff;padding:8px 16px;border-radius:20px;z-index:99;max-width:90vw}
@media(max-width:760px){#app{display:block}#det{display:none;height:100%}body.det #list{display:none}body.det #det{display:block}.bk{display:block}}
</style>
</head>
<body>
<div id="login" hidden>
  <h2>lvlv</h2>
  <input id="em" type="email" placeholder="이메일" autocomplete="username">
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
  <button id="go" class="p">로그인</button><small id="lmsg"></small>
</div>
<div id="app" hidden>
  <aside id="list">
    <h1><span>lvlv</span><button id="add" title="인물 추가">＋</button><button id="set" title="설정">⚙</button></h1>
    <input id="q" placeholder="이름·출처·키워드 검색">
    <div id="cl"></div>
  </aside>
  <main id="det"><div id="dc"></div></main>
</div>

<dialog id="dlg"><form id="df"><h3 id="dlg-h"></h3><div id="dlg-b" style="display:grid;gap:8px"></div>
  <div class="row" style="justify-content:flex-end"><button type="button" id="dlg-d" hidden>삭제</button><button type="button" id="dlg-x">취소</button><button class="p">저장</button></div></form></dialog>
<dialog id="nc"><form id="nf"><h3>새 인물</h3>
  <input name="name" placeholder="이름 *" required>
  <div class="row"><input name="origin" placeholder="출처 (소설·영화·현실…)"><select name="sex"><option value="">성별</option><option value="f">여</option><option value="m">남</option></select></div>
  <div class="tl-t">인물 키워드 <small class="mut">성격·신분·직업 등</small></div><div class="ti" data-k="char"><input class="ti-in" data-k="char" list="dl-char" placeholder="#키워드 (띄어쓰기·쉼표·Enter)"></div><div class="tl-t">외모 키워드</div><div class="ti" data-k="look"><input class="ti-in" data-k="look" list="dl-look" placeholder="#키워드"></div>
  <div><label class="btn">대표 사진 선택<input type="file" name="photo" id="nc-f" accept="image/*" hidden></label> <small id="nc-fn" class="mut"></small></div>
  <textarea name="quote" rows="2" placeholder="대표 어록"></textarea><textarea name="profile" rows="3" placeholder="대표 프로필"></textarea>
  <small class="mut">입력한 값으로 첫 페이지가 만들어지고, 빈 두 번째 페이지가 함께 생겨요. 나중에 편집 모드에서 바꿀 수 있어요.</small>
  <div class="row" style="justify-content:flex-end"><button type="button" id="nc-x">취소</button><button class="p">만들기</button></div></form></dialog>
<dialog id="rd"><h3 id="rd-h"></h3><p id="rd-p" style="white-space:pre-wrap"></p><div class="row" style="justify-content:flex-end"><button id="rd-x">닫기</button></div></dialog>
<dialog id="im"><img id="im-i" alt="" style="max-width:100%;max-height:46vh;display:block;margin:0 auto 10px"><input id="im-c" placeholder="캡션" style="width:100%">
  <div class="row"><button data-m="cover">프로필 사진으로</button><button data-m="recrop">다시 자르기</button><button data-m="orig">원본 보기</button><button data-m="del">삭제</button></div>
  <div class="row" style="justify-content:flex-end"><button data-m="x">닫기</button><button class="p" data-m="save">저장</button></div></dialog>
<dialog id="cr"><h3>썸네일 영역 선택</h3><small class="mut">정사각형 영역을 끌어서 옮기고, 오른쪽 아래 점으로 크기를 바꾸세요. 원본은 따로 보관돼요.</small>
  <div id="cr-box"><img id="cr-img" alt=""><div id="cr-sel"><i id="cr-rz"></i></div></div>
  <div class="row" style="justify-content:flex-end"><button type="button" id="cr-x">취소</button><button type="button" id="cr-full">자르지 않고 전체</button><button type="button" class="p" id="cr-ok">이 영역으로</button></div></dialog>
<dialog id="lb"><img alt=""><p></p><button id="lb-x">닫기</button></dialog>
<dialog id="st"><h3>설정</h3><p id="st-me"></p>
  <p><b>원본 사진 폴더 (PC)</b><br><small>이미지를 올릴 때 원본이 이 폴더에 저장돼요. 폰에서 올린 원본은 서버에 잠시 보관됐다가 여기서 받으면 폴더로 옮겨져요.</small><br>
  <button id="st-dir">폴더 연결</button> <button id="st-sync">원본 받기</button> <small id="st-msg"></small></p>
  <p><b>연결 확인</b><br><button id="st-test">테스트</button> <small id="st-t"></small></p>
  <div class="row" style="justify-content:space-between"><button id="st-out">로그아웃</button><button id="st-x">닫기</button></div></dialog>
<datalist id="dl-char"></datalist><datalist id="dl-look"></datalist>
<div id="toast" hidden></div>

<script src="https://jjojjolonglong-sudo.github.io/mnmn/media.js"></script>
<script>
const SB='https://rtvvajhsnwkkrmncyfbs.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0dnZhamhzbndra3JtbmN5ZmJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NjkwMTEsImV4cCI6MjEwNzA0NTAxMX0.O2aLLeazv_FhUhbVAkp4vz3pw8GPb_683dUu7Et1Cwk';
const W='https://media.jjojjolonglong.workers.dev';
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!window.Media){const f=async()=>{throw new Error('media.js를 불러오지 못했어요')};window.Media={init(){},url:()=>'',newId:()=>crypto.randomUUID(),folder:{supported:false,name:async()=>''},save:f}}
const toast=t=>{const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3000)};
const guard=f=>async(...a)=>{try{return await f(...a)}catch(e){toast(e.message)}};

/* ---------- 로그인 / Supabase (REST) ---------- */
let SES=null;try{SES=JSON.parse(localStorage.getItem('lvlv_ses')||'null')}catch(e){}
const saveSes=s=>{SES=s;try{s?localStorage.setItem('lvlv_ses',JSON.stringify(s)):localStorage.removeItem('lvlv_ses')}catch(e){}};
async function gotrue(grant,body){const r=await fetch(`${SB}/auth/v1/token?grant_type=${grant}`,{method:'POST',headers:{apikey:ANON,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error_description||j.msg||'로그인 실패');j.expires_at=Date.now()+j.expires_in*1000;return j}
let rf=null;
async function token(){if(!SES)throw new Error('로그인이 필요해요');if(SES.expires_at-Date.now()<60000){rf=rf||gotrue('refresh_token',{refresh_token:SES.refresh_token}).then(saveSes).finally(()=>{rf=null});await rf}return SES.access_token}
Media.init({getToken:token});
async function db(m,t,q,body){
  const r=await fetch(`${SB}/rest/v1/${t}${q||''}`,{method:m,headers:{apikey:ANON,Authorization:'Bearer '+await token(),'Content-Type':'application/json',Prefer:'return=representation'},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&j.message)||'HTTP '+r.status);return j;
}

/* ---------- 상태 ---------- */
const S={chars:[],imgs:[],texts:[],kwAll:[],links:[],cur:null,edit:false,kw:{char:[],look:[]},q:''};
const cur=()=>S.chars.find(c=>c.id===S.cur);
const REP={quote:'quote_id',profile:'profile_id'},KL={quote:'어록',profile:'프로필',look:'외모'};
const kws=s=>s.split(',').map(x=>x.trim()).filter(Boolean);
const sortChars=()=>S.chars.sort((a,b)=>a.name.localeCompare(b.name,'ko'));
const charKw=(c,k)=>S.links.filter(l=>l.char_id===c.id).map(l=>S.kwAll.find(x=>x.id===l.keyword_id)).filter(x=>x&&x.kind===k).map(x=>x.name);
async function loadAll(){
  const [c,i,k,l]=await Promise.all([db('GET','lvlv_char','?select=*&order=name'),db('GET','lvlv_image','?select=*&order=sort_order,created_at'),db('GET','lvlv_keyword','?select=*&order=name'),db('GET','lvlv_char_keyword','?select=char_id,keyword_id')]);
  S.chars=c;S.imgs=i;S.kwAll=k;S.links=l;if(S.cur&&!cur())S.cur=null;renderList();S.cur?await pick(S.cur):emptyDet();
}
function renderList(){
  const q=S.q.trim().toLowerCase(),L=S.chars.filter(c=>!q||[c.name,c.origin,...charKw(c,'char'),...charKw(c,'look')].join(' ').toLowerCase().includes(q));
  $('#cl').innerHTML=L.map(c=>{const im=S.imgs.find(x=>x.id===c.cover_id);
    return `<div class="ci${c.id===S.cur?' on':''}" data-id="${c.id}"><div class="th"${im?` style="background-image:url('${Media.url(im.image)}')"`:''}>${im?'':E([...c.name][0]||'')}</div><div><b>${E(c.name)}</b><br><small>${E(c.origin||'')}${c.sex?' · '+(c.sex==='f'?'여':'남'):''}</small></div></div>`}).join('')||'<p class="mut">인물이 없어요. ＋로 추가하세요</p>';
}
const emptyDet=()=>{$('#dc').innerHTML='<p class="mut">왼쪽에서 인물을 고르거나 ＋로 추가하세요</p>'};
async function pick(id){
  S.cur=id;S.edit=false;bpg=0;bsel=null;S.texts=await db('GET','lvlv_text',`?char_id=eq.${id}&select=*&order=sort_order,created_at`);
  document.body.classList.add('det');renderList();renderDet();
}

/* ---------- 인물 화면: 스크랩북 하나. 첫 페이지는 입력값으로 자동 생성, 편집 모드에서만 수정 ---------- */
function renderDet(){
  const c=cur();if(!c)return emptyDet();
  $('#dc').innerHTML=`<button class="bk" id="bk">‹ 목록</button>
  <div class="bar"><b class="nn">${E(c.name)}</b><button data-a="${S.edit?'ex':'ee'}"${S.edit?' class="p"':''}>${S.edit?'편집 끝내기':'편집'}</button>${S.edit?'<button id="del">인물 삭제</button>':''}</div>${S.edit?editPanel(c):''}
  <div class="sbn"><button data-p="-1">‹</button><span id="pn"></span><button data-p="1">›</button>${S.edit?'<button data-p="add">＋ 페이지</button><button data-p="del">마지막 페이지 삭제</button>':''}</div>
  <div id="sbw"><div class="sb" id="sb"></div></div>`;
  if(S.edit){fillDl();tiDraw()}
  drawBoard();
}
function editPanel(c){
  const I=S.imgs.filter(x=>x.char_id===c.id),T=S.texts;
  return `<details class="card"><summary>인물 정보 (첫 페이지에 반영)</summary>
    <input id="f-name" value="${E(c.name)}" style="width:100%;margin:8px 0">
    <div class="row"><input id="f-origin" placeholder="출처 (소설·영화·현실…)" value="${E(c.origin||'')}"><select id="f-sex"><option value="">성별</option><option value="f"${c.sex==='f'?' selected':''}>여</option><option value="m"${c.sex==='m'?' selected':''}>남</option></select></div>
    <div class="tl-t">인물 키워드 <small class="mut">성격·신분·직업 등</small></div><div class="ti" data-k="char"><input class="ti-in" data-k="char" list="dl-char" placeholder="#키워드 (띄어쓰기·쉼표·Enter)"></div><div class="tl-t">외모 키워드</div><div class="ti" data-k="look"><input class="ti-in" data-k="look" list="dl-look" placeholder="#키워드"></div><button class="p" data-a="cs">저장</button></details>
  <div class="card"><div class="bar"><b>이미지</b><label class="btn">＋ 올리기<input type="file" id="fi" accept="image/*" multiple hidden></label><small class="mut">＋ 누르면 페이지에 붙이고, 더블클릭하면 설정(프로필 사진·캡션·삭제)</small></div>

/* ---------- #키워드 블록 입력: 인물 키워드 / 외모 키워드. 같은 이름이 이미 있으면 그걸 쓰고, 없으면 저장할 때 새로 만들어요 ---------- */
const kwFind=(k,n)=>S.kwAll.find(x=>x.kind===k&&x.name.toLowerCase()===n.toLowerCase());
function tiDraw(){document.querySelectorAll('.ti').forEach(ti=>{const k=ti.dataset.k,inp=ti.querySelector('.ti-in');ti.querySelectorAll('.chip').forEach(x=>x.remove());
  S.kw[k].forEach(n=>inp.insertAdjacentHTML('beforebegin',`<span class="chip${kwFind(k,n)?'':' new'}" title="${kwFind(k,n)?'':'새 키워드 (저장하면 만들어져요)'}">#${E(n)}<b data-x="${k}|${E(n)}">✕</b></span>`))})}
function tiCommit(inp,final){
  const k=inp.dataset.k,raw=inp.value,parts=raw.split(/[\s,]+/),keep=final||/[\s,]$/.test(raw)?'':parts.pop();
  parts.map(x=>x.replace(/^#+/,'').trim()).filter(Boolean).forEach(n=>{const ex=kwFind(k,n),name=ex?ex.name:n;if(!S.kw[k].some(v=>v.toLowerCase()===name.toLowerCase()))S.kw[k].push(name)});
  inp.value=keep;tiDraw();
}
const commitAll=()=>document.querySelectorAll('.ti-in').forEach(i=>tiCommit(i,true));
const isTi=t=>t&&t.classList&&t.classList.contains('ti-in');
function fillDl(){for(const k of ['char','look'])$('#dl-'+k).innerHTML=S.kwAll.filter(x=>x.kind===k).map(x=>`<option value="${E(x.name)}">`).join('')}
async function saveKw(cid){   // S.kw → lvlv_keyword(없으면 생성) + lvlv_char_keyword(연결)
  const need=[];
  for(const k of ['char','look'])for(const n of S.kw[k])if(!kwFind(k,n)&&!need.some(x=>x.kind===k&&x.name===n))need.push({kind:k,name:n,user_id:SES.user.id});
  if(need.length)S.kwAll.push(...await db('POST','lvlv_keyword','',need));
  const ids=[...new Set(['char','look'].flatMap(k=>S.kw[k].map(n=>kwFind(k,n).id)))];
  await db('DELETE','lvlv_char_keyword',`?char_id=eq.${cid}`);
  if(ids.length)await db('POST','lvlv_char_keyword','',ids.map(keyword_id=>({char_id:cid,keyword_id,user_id:SES.user.id})));
  S.links=S.links.filter(l=>l.char_id!==cid).concat(ids.map(keyword_id=>({char_id:cid,keyword_id})));fillDl();
}

/* ---------- 이미지: 올리기 / 설정(더블클릭) / 크게 보기 ---------- */
/* 썸네일 영역 고르기: 정사각형으로 잘라서(얼굴 클로즈업 등) 200px로 올리고, 원본은 따로 보관 */
function cropPick(file){
  return new Promise(res=>{
    const dlg=$('#cr'),img=$('#cr-img'),sel=$('#cr-sel'),box=$('#cr-box'),url=URL.createObjectURL(file);let q={x:0,y:0,s:0};
    const done=r=>{dlg.oncancel=null;URL.revokeObjectURL(url);if(dlg.open)dlg.close();res(r)};
    const paint=()=>{sel.style.cssText=`left:${q.x}px;top:${q.y}px;width:${q.s}px;height:${q.s}px`};
    img.onload=()=>{const W=img.clientWidth,H=img.clientHeight,s0=Math.min(W,H)*.7;q={x:(W-s0)/2,y:Math.max(0,(H-s0)*.25),s:s0};paint()};
    box.onpointerdown=ev=>{
      const W=img.clientWidth,H=img.clientHeight,rz=ev.target.id==='cr-rz';if(!rz&&ev.target.id!=='cr-sel')return;
      box.setPointerCapture(ev.pointerId);const x0=q.x,y0=q.y,s0=q.s,cx=ev.clientX,cy=ev.clientY;
      box.onpointermove=m=>{const dx=m.clientX-cx,dy=m.clientY-cy;
        if(rz)q.s=Math.max(30,Math.min(s0+Math.max(dx,dy),W-q.x,H-q.y));
        else{q.x=Math.max(0,Math.min(x0+dx,W-q.s));q.y=Math.max(0,Math.min(y0+dy,H-q.s))}
        paint()};
      box.onpointerup=()=>{box.onpointermove=box.onpointerup=null};
    };
    $('#cr-x').onclick=()=>done(null);$('#cr-full').onclick=()=>done({crop:null});dlg.oncancel=()=>done(null);
    $('#cr-ok').onclick=async()=>{try{
      const bmp=await createImageBitmap(file,{imageOrientation:'from-image'}),k=bmp.width/img.clientWidth,sz=Math.max(1,Math.round(q.s*k)),c=document.createElement('canvas');
      c.width=c.height=sz;c.getContext('2d').drawImage(bmp,q.x*k,q.y*k,q.s*k,q.s*k,0,0,sz,sz);bmp.close();
      const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.95));done({crop:new File([blob],'crop.jpg',{type:'image/jpeg'})});
    }catch(e){toast('이미지를 읽을 수 없어요');done(null)}};
    img.src=url;dlg.showModal();
  });
}
async function saveImg(file,id,pre){   // 자른 영역(또는 전체)을 200px WebP로 R2에, 원본은 폴더(PC) 또는 서버 inbox에
  const r=pre||await cropPick(file);if(!r)return null;toast('올리는 중…');
  const p=await Media.process(r.crop||file);let hash;try{hash=await Media.upload(p)}finally{p.close()}
  let original='failed',err='';try{original=await Media.original(id,file)}catch(e){err=e.message}
  return {hash,original,err};
}
const addFiles=guard(async files=>{
  const fs=[...files].filter(f=>f.type.startsWith('image/'));

});

/* ---------- 스크랩북: 1쪽은 자동 생성, 2쪽부터 자유 배치 (PC는 두 쪽씩 펼침) ---------- */
const PW=600,PH=840;
let bsel=null,bt,bpg=0;
const maxZ=b=>Math.max(0,...b.items.map(o=>o.z||0));
const bget=c=>{let b=c.board;if(!b||Array.isArray(b))b=c.board={n:2,items:Array.isArray(b)?b:[]};b.items.forEach(o=>{if(!o.p)o.p=1});b.n=Math.max(2,b.n||2,...b.items.map(o=>o.p+1));return b};
const bsave=()=>{clearTimeout(bt);bt=setTimeout(guard(async()=>{const c=cur();if(c)await db('PATCH','lvlv_char',`?id=eq.${c.id}`,{board:c.board})}),700)};
const stepOf=()=>($('#sbw')&&$('#sbw').clientWidth>=760?2:1);
function drawBoard(){
  const c=cur(),w=$('#sbw');if(!c||!w)return;
  const b=bget(c);b.items=b.items.filter(o=>o.k==='t'||(o.k==='i'?S.imgs.some(x=>x.id===o.ref):S.texts.some(t=>t.id===o.ref)));
  const W=w.clientWidth||PW,two=W>=760,pw=Math.min(PW,two?W/2:W),s=pw/PW,st=two?2:1;
  bpg=Math.max(0,Math.min(Math.floor(bpg/st)*st,Math.floor((b.n-1)/st)*st));
  const sb=$('#sb'),ps=two?[bpg,bpg+1]:[bpg];sb.className='sb'+(two?' two':'')+(S.edit?' ed':'');sb.innerHTML='';
  ps.forEach((pi,k)=>{
    const pg=document.createElement('div');pg.className='pg'+(two?(k?' r':' l'):'')+(pi>=b.n?' blank':'');pg.style.cssText=`width:${pw}px;height:${PH*s}px`;
    if(pi<b.n){const inn=document.createElement('div');inn.className='pgi';inn.style.transform=`scale(${s})`;
      if(pi===0)inn.innerHTML=firstPage(c);else b.items.filter(o=>o.p===pi).forEach(o=>inn.appendChild(itemEl(o,s,b)));pg.appendChild(inn)}
    sb.appendChild(pg);
  });
  $('#pn').textContent=`${ps.filter(p=>p<b.n).map(p=>p+1).join('–')} / ${b.n}쪽`;
}
function itemEl(o,s,b){
  const e=document.createElement('div');e.className=`it ${o.k} c${parseInt(o.id.slice(0,2),16)%3}${bsel===o.id&&S.edit?' sel':''}`;
  e.style.cssText=`left:${o.x}px;top:${o.y}px;width:${o.w}px;z-index:${o.z||1};transform:rotate(${o.r||0}deg)`;
  if(o.k==='i')e.innerHTML=`<img src="${Media.url(S.imgs.find(x=>x.id===o.ref).image)}" alt="">`;
  else if(o.k==='q'){const t=S.texts.find(x=>x.id===o.ref);e.innerHTML=`<p>${E(t.body)}</p>${t.source?`<small>${E(t.source)}</small>`:''}`}
  else{e.innerHTML=`<p contenteditable="${S.edit?'plaintext-only':'false'}">${E(o.t||'')}</p>`;e.firstChild.oninput=()=>{o.t=e.firstChild.textContent;bsave()}}
  e.ondblclick=()=>{if(o.k==='i')openImg(o.ref)};
  if(!S.edit)return e;   // 감상 모드: 고정
  e.insertAdjacentHTML('beforeend','<i class="rz"></i>');
  e.onpointerdown=ev=>{
    if(ev.target.className==='rz')return resize(ev,o,e,s);
    if(o.k==='t'&&ev.target.tagName==='P')return;
    bsel=o.id;$('#sb').querySelectorAll('.it').forEach(x=>x.classList.toggle('sel',x===e));
    o.z=maxZ(b)+1;e.style.zIndex=o.z;
    const x0=o.x,y0=o.y,cx=ev.clientX,cy=ev.clientY;e.setPointerCapture(ev.pointerId);
    e.onpointermove=m=>{o.x=Math.min(PW-40,Math.max(40-o.w,Math.round(x0+(m.clientX-cx)/s)));o.y=Math.min(PH-40,Math.max(0,Math.round(y0+(m.clientY-cy)/s)));e.style.left=o.x+'px';e.style.top=o.y+'px'};
    e.onpointerup=()=>{e.onpointermove=e.onpointerup=null;bsave()};
  };
  return e;
}
function resize(ev,o,e,s){
  ev.stopPropagation();e.setPointerCapture(ev.pointerId);const w0=o.w,x0=ev.clientX;
  const mv=m=>{o.w=Math.max(80,Math.round(w0+(m.clientX-x0)/s));e.style.width=o.w+'px'};
  const up=()=>{e.removeEventListener('pointermove',mv);e.removeEventListener('pointerup',up);bsave()};
  e.addEventListener('pointermove',mv);e.addEventListener('pointerup',up);
}
function addBoard(k,ref){   // 1쪽은 자동 페이지라 2쪽부터 붙음
  const c=cur(),b=bget(c),p=bpg||1,n=b.items.filter(o=>o.p===p).length;
  const o={id:crypto.randomUUID(),k,ref:ref||null,p,x:30+(n*28)%300,y:30+(n*22)%260,w:k==='i'?170:k==='q'?220:190,r:((n*7)%9)-4,z:maxZ(b)+1};
  if(k==='t')o.t='';b.items.push(o);bsel=o.id;if(stepOf()===1)bpg=p;drawBoard();bsave();
}
function boardAct(a){
  const c=cur(),b=bget(c),o=b.items.find(x=>x.id===bsel);if(!o)return toast('페이지에서 오브젝트를 먼저 눌러 선택하세요');
  if(a==='rl')o.r=(o.r||0)-5;if(a==='rr')o.r=(o.r||0)+5;if(a==='sm')o.w=Math.max(80,Math.round(o.w*.9));if(a==='bg')o.w=Math.round(o.w*1.1);
  if(a==='fr')o.z=maxZ(b)+1;
  if(a==='pl'||a==='pr'){o.p=Math.min(b.n-1,Math.max(1,o.p+(a==='pr'?1:-1)));bpg=o.p}
  if(a==='rm'){b.items=b.items.filter(x=>x!==o);bsel=null}
  drawBoard();bsave();
}
function pageAct(a){
  const c=cur(),b=bget(c);
  if(a==='add'){b.n++;bpg=b.n-1}
  else if(a==='del'){
    const last=b.n-1;if(b.n<=2)return toast('첫 페이지와 빈 페이지 하나는 있어야 해요');
    if(b.items.some(o=>o.p===last)&&!confirm('마지막 페이지의 오브젝트가 모두 사라져요. 계속할까요?'))return;
    b.items=b.items.filter(o=>o.p!==last);b.n--;
  }else bpg+=(+a)*stepOf();
  drawBoard();if(a==='add'||a==='del')bsave();
}
addEventListener('resize',()=>{if(S.cur)drawBoard()});

/* ---------- 이벤트 ---------- */
function startEdit(){const c=cur();S.edit=true;S.kw={char:charKw(c,'char'),look:charKw(c,'look')};renderDet()}
document.addEventListener('click',guard(async e=>{
  const t=e.target,g=s=>t.closest(s);
  if(g('#bk')){document.body.classList.remove('det');return}
  if(g('.ci'))return pick(g('.ci').dataset.id);
  if(g('[data-add]')){const [k,r]=g('[data-add]').dataset.add.split(':');return addBoard(k,r)}
  if(g('[data-b]'))return boardAct(g('[data-b]').dataset.b);
  if(g('[data-p]'))return pageAct(g('[data-p]').dataset.p);
  if(g('[data-x]')){const [k,n]=g('[data-x]').dataset.x.split('|');S.kw[k]=S.kw[k].filter(v=>v!==n);return tiDraw()}
  if(g('.ti'))return g('.ti').querySelector('.ti-in').focus();
  if(g('[data-m]'))return imAct(g('[data-m]').dataset.m);
  if(!S.edit&&g('[data-r]')){const x=S.texts.find(q=>q.id===g('[data-r]').dataset.r);if(x){$('#rd-h').textContent=KL[x.kind]+(x.title?' · '+x.title:'');$('#rd-p').textContent=x.body+(x.source?'\n— '+x.source:'');$('#rd').showModal()}return}
  if(!S.edit&&g('[data-ri]'))return openImg(g('[data-ri]').dataset.ri);
  const a=g('[data-a]');
  if(a){
    const k=a.dataset.a,c=cur();
    if(k==='ee')return startEdit();
    if(k==='ex'){S.edit=false;bsel=null;return renderDet()}
    if(k==='tn')return editText(null);
    if(k==='cs'){
      commitAll();const name=$('#f-name').value.trim();if(!name)return toast('이름을 입력하세요');
      const r=await db('PATCH','lvlv_char',`?id=eq.${c.id}`,{name,origin:$('#f-origin').value.trim()||null,sex:$('#f-sex').value||null,updated_at:new Date().toISOString()});
      Object.assign(c,r[0]);await saveKw(c.id);sortChars();renderList();toast('저장했어요');return renderDet();
    }
  }
  if(g('#del')){const c=cur();if(!confirm(`'${c.name}' 과(와) 글감·이미지 연결을 모두 삭제할까요?`))return;await db('DELETE','lvlv_char',`?id=eq.${c.id}`);S.chars=S.chars.filter(x=>x.id!==c.id);S.imgs=S.imgs.filter(x=>x.char_id!==c.id);S.links=S.links.filter(l=>l.char_id!==c.id);S.cur=null;S.edit=false;document.body.classList.remove('det');renderList();return emptyDet()}
}));
addEventListener('dblclick',e=>{
  if(!S.edit||e.target.closest('.ad'))return;
  const i=e.target.closest('.mi'),x=e.target.closest('.tx2');
  if(i)openIm(i.dataset.i);else if(x)editText(S.texts.find(q=>q.id===x.dataset.t));
});
let NC=null;
document.addEventListener('change',guard(async e=>{
  if(e.target.id==='fi')return addFiles(e.target.files);
  if(e.target.id==='nc-f'){const f=e.target.files[0];NC=null;$('#nc-fn').textContent='';if(!f)return;const r=await cropPick(f);if(r){NC={file:f,r};$('#nc-fn').textContent=f.name}else e.target.value=''}
}));
document.addEventListener('input',e=>{if(!isTi(e.target))return;if(e.inputType==='insertReplacementText')tiCommit(e.target,true);else if(!e.isComposing)tiCommit(e.target,false)});   // 추천 목록에서 고르면 바로 확정
document.addEventListener('compositionend',e=>{if(isTi(e.target))setTimeout(()=>tiCommit(e.target,false),0)});
document.addEventListener('keydown',e=>{
  if(isTi(e.target)){const k=e.target.dataset.k;if(e.key==='Enter'&&!e.isComposing){e.preventDefault();tiCommit(e.target,true)}else if(e.key==='Backspace'&&!e.target.value&&S.kw[k].length){S.kw[k].pop();tiDraw()}return}
  if(e.key==='Delete'&&S.edit&&bsel&&!e.target.isContentEditable&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))boardAct('rm');
});
document.addEventListener('focusout',e=>{if(isTi(e.target))tiCommit(e.target,true)});
$('#q').oninput=e=>{S.q=e.target.value;renderList()};

/* ---------- 새 인물: 대표 값을 입력하면 첫 페이지 + 빈 2쪽이 만들어짐 ---------- */
$('#add').onclick=()=>{
  if(S.edit){S.edit=false;renderDet()}   // 편집 폼의 키워드 입력과 겹치지 않게
  S.kw={char:[],look:[]};NC=null;$('#nf').reset();$('#nc-fn').textContent='';fillDl();tiDraw();$('#nc').showModal();
};
$('#nc-x').onclick=()=>$('#nc').close();
$('#nf').onsubmit=guard(async e=>{
  e.preventDefault();commitAll();const f=new FormData(e.target),name=String(f.get('name')).trim();if(!name)return;
  const btn=e.submitter;btn.disabled=true;
  try{
    let r=await db('POST','lvlv_char','',{name,origin:String(f.get('origin')).trim()||null,sex:f.get('sex')||null,user_id:SES.user.id,board:{n:2,items:[]}});
    const c=r[0],patch={};
    if(NC){const id=Media.newId(),x=await saveImg(NC.file,id,NC.r);
      if(x){const ir=await db('POST','lvlv_image','',{id,char_id:c.id,user_id:SES.user.id,image:x.hash,sort_order:0});S.imgs.push(ir[0]);patch.cover_id=id;if(x.original==='failed')toast('원본 보관에 실패했어요: '+x.err)}}
    for(const k in REP){const body=String(f.get(k)||'').trim();if(body){const tr=await db('POST','lvlv_text','',{char_id:c.id,user_id:SES.user.id,kind:k,body,sort_order:0});patch[REP[k]]=tr[0].id}}
    if(Object.keys(patch).length)r=await db('PATCH','lvlv_char',`?id=eq.${c.id}`,patch);
    await saveKw(c.id);S.chars.push(r[0]);sortChars();$('#nc').close();await pick(r[0].id);
  }finally{btn.disabled=false}
});

/* ---------- 설정 ---------- */
$('#set').onclick=async()=>{
  $('#st-me').textContent=(SES&&SES.user&&SES.user.email)||'';
  $('#st-dir').textContent=await Media.folder.name().then(n=>n?'폴더: '+n+' (변경)':'폴더 연결').catch(()=>'폴더 연결');
  $('#st').showModal();
};
$('#st-x').onclick=()=>$('#st').close();
$('#st-dir').onclick=async()=>{try{await Media.folder.connect();$('#st-dir').textContent='폴더: '+await Media.folder.name()+' (변경)'}catch(e){if(e.name!=='AbortError')$('#st-msg').textContent=e.message||'이 브라우저에서는 지원하지 않아요'}};
$('#st-sync').onclick=async()=>{const m=$('#st-msg');try{m.textContent='받는 중…';const r=await Media.sync({onProgress:p=>m.textContent=p.done+'/'+p.total});m.textContent=r.total?`완료 ${r.done}/${r.total}`+(r.failed.length?` · 실패 ${r.failed.length}`:''):'받을 원본이 없어요'}catch(e){m.textContent=e.message}};
$('#st-test').onclick=async()=>{
  const o=$('#st-t');o.textContent='확인 중…';const out=[];
  try{const j=await (await fetch(W+'/')).json();out.push(j.ok&&j.bucket?`이미지 서버 ✓ v${j.version||1}`:'이미지 서버 ✗')}catch(e){out.push('이미지 서버 ✗')}
  try{await db('GET','lvlv_char','?select=id&limit=1');out.push('Supabase ✓')}catch(e){out.push('Supabase ✗ '+e.message)}
  o.textContent=out.join(' · ');
};
$('#st-out').onclick=()=>{saveSes(null);$('#st').close();show()};

/* ---------- 시작 ---------- */
$('#go').onclick=async()=>{$('#lmsg').textContent='';try{saveSes(await gotrue('password',{email:$('#em').value.trim(),password:$('#pw').value}));show()}catch(e){$('#lmsg').textContent=e.message}};
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click()});
function show(){$('#login').hidden=!!SES;$('#app').hidden=!SES;if(SES)guard(loadAll)()}
show();
</script>
</body>
</html>
