.fp-r{left:296px;top:56px;width:270px;max-height:290px;overflow:hidden}.fp-r h2{margin:0;font-size:34px;line-height:1.15}.fp-fn{margin-top:6px;font-size:15px;color:var(--ink)}.fp-o{margin:6px 0 12px;color:var(--mut)}
.fp-k{}.fp-k .tg span{font-size:13px}.tg.lk span{background:none;border:1px solid var(--ac)}.tg.st span{background:none;border:1px dashed var(--mut)}
.fp-c{padding:10px 14px;box-shadow:0 3px 8px #0003;cursor:pointer;overflow:hidden}.fp-c small{display:block;color:var(--mut);margin-bottom:4px;letter-spacing:2px}
.fp-c p{margin:0;white-space:pre-wrap;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;-webkit-line-clamp:7}
.fp-c.c{left:36px;top:352px;width:528px;height:118px;background:#e7ecf1;transform:rotate(-.4deg)}.fp-c.c p{-webkit-line-clamp:3}
.fp-c.b{left:36px;top:494px;width:528px;height:304px;background:#e1ebf6;transform:rotate(.6deg);display:flex;flex-direction:column}
.qb{flex:1;min-height:0;overflow:hidden;line-height:1.5}.fp-c .qb .ql{display:block;-webkit-line-clamp:none;margin:0 0 .45em}
.fp-c small.qm{flex:none;margin:6px 0 0;letter-spacing:0;color:var(--ac);border-top:1px dashed #4a678555;padding-top:5px}
.tl-t{margin:8px 0 2px;font-size:13px;color:var(--mut)}.chip.new{outline:1px dashed var(--ac)}
#cr{max-width:min(94vw,820px)}#cr-box{position:relative;width:fit-content;margin:10px auto;touch-action:none;user-select:none}#cr-img{max-width:min(88vw,780px);max-height:60vh;display:block}
#cr-sel{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px #0008;cursor:move}#cr-rz{position:absolute;right:-9px;bottom:-9px;width:16px;height:16px;border-radius:50%;background:var(--ac);border:2px solid #fff;cursor:nwse-resize}
.sb:not(.ed) .it{cursor:default}.sb:not(.ed) .it.i{cursor:zoom-in}
dialog{border:1px solid var(--ln);border-radius:6px;background:var(--paper);color:var(--ink);padding:18px;max-width:min(560px,94vw);width:100%}
dialog::backdrop{background:#0006}dialog form{display:grid;gap:8px}dialog h3{margin:0 0 8px}
#lb{max-width:94vw;width:auto;text-align:center}#lb img{max-width:90vw;max-height:78vh;display:block;margin:0 auto 8px}

@media(max-width:760px){body:has(#app:not([hidden])){padding:0}#app{display:block;width:auto;max-width:none;height:100%;margin:0;border:0;border-radius:0;box-shadow:none}#list{width:auto;height:100%;border:0}#det{display:none;height:100%;padding:12px}body.det #list{display:none}body.det #det{display:block}.bk{display:block}#det .ptl{flex-wrap:wrap;white-space:normal}#det .ipg{height:auto!important;min-height:0}}
#sv{font-size:12px}
.wrap{max-width:100%}
.hdr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;min-height:34px}.hfn{color:var(--mut);font-size:14px}
.hdr .nn{margin-right:4px}.dl{background:none;border-color:transparent;color:var(--mut);font-size:12px;padding:4px 6px;margin-left:6px}.dl:hover{color:#b0603a;border-color:#e3c3b3}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:6px;overflow:hidden;background:var(--paper);flex:none}
.seg button{border:0;border-radius:0;padding:5px 12px;background:none}.seg button+button{border-left:1px solid var(--ln)}.seg button:hover{background:#eef2f6}.seg button.on{background:var(--ac);color:#fff}
.seg.sm button{padding:3px 12px}
/* 인물 정보: 스크랩북 펼침면과 같은 크기의 종이 한 장 */
.ipg{background:var(--paper);box-shadow:0 2px 10px #0003;border-radius:3px;overflow:auto}
.w2 .ipg{display:grid;grid-template-columns:1fr 1fr;overflow:hidden}.w2 .ipc{overflow:auto;min-height:0;display:flex;flex-direction:column}
.ipc{padding:24px 26px}.w2 .ipc:first-child{box-shadow:inset -22px 0 22px -22px #0000001f}.w2 .ipc+.ipc{box-shadow:inset 22px 0 22px -22px #0000001f}
.ih{display:flex;align-items:center;gap:10px;margin-bottom:12px}.ih b{font-size:15px}
.fg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 12px;align-items:center}.w2 .fg.grow{flex:1;grid-template-rows:repeat(var(--n),auto) minmax(110px,1fr)}
.fg>label{font-size:13px;color:var(--mut);white-space:nowrap}.fg input,.fg textarea{width:100%;min-width:0}.fg .tp{align-self:start;padding-top:6px}.w2 .fq{height:100%;resize:none}

.dock{margin-top:10px}

.dock-h{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}.dock-h>*{flex:none;white-space:nowrap}.dock-h>small{flex:1}.dock-h small{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock-h .tg2{padding:3px 9px;margin-left:auto}.dock .ml,.dock .tl{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;max-height:none;margin-top:8px;padding:4px 2px 6px;height:102px;align-items:flex-start}.dock .mi{width:84px;height:84px}
.dock.ns .ad{display:none}
#f-sex{justify-self:start}.wn .dock-h small,.wn .ptl .vr{display:none}
/* 키워드 관리 */
.kc-r,.kc-h{display:grid;grid-template-columns:minmax(0,1fr) 118px 44px 28px 28px 28px;gap:6px;align-items:center;margin:0 0 6px}
.kr{display:grid;grid-template-columns:minmax(0,1fr) 104px 108px 40px 28px 28px;gap:6px;align-items:center;margin:0 0 6px}
.kc-h{margin-bottom:4px;font-size:12px;color:var(--mut)}.kc-r input,.kc-r select,.kr input,.kr select{width:100%;min-width:0;font-size:13px;padding:4px 7px}
.kc-r.sub .cn{width:calc(100% - 18px);margin-left:18px}.kc-r small,.kr small{white-space:nowrap;text-align:right;font-size:12px}
.mv{width:28px;height:30px;padding:0;font-size:12px;text-align:center;color:var(--mut)}.mv:hover{color:var(--ink)}[data-cm].mv{font-size:9px}.mv.x:hover{color:#b0603a;border-color:#e3c3b3}
.kc-add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;margin-top:12px}
#kq{margin-left:auto;width:150px;padding:3px 9px;font-size:13px}
.ks-h{display:flex;gap:6px;align-items:baseline;font-weight:600;margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--ln)}.ks:first-of-type .ks-h{margin-top:4px}
.mg-r{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-2px 0 10px;padding:8px 10px;border:1px dashed var(--ac);border-radius:4px;background:#f3f6f9;font-size:13px}.mg-r select{flex:1;min-width:140px;font-size:13px;padding:4px 7px}

.stp{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}.ipc .ih+.stp{margin-top:-4px}.ipc .stp+.ih{margin-top:20px}
.w2 .ipg.one{grid-template-columns:1fr}
.wn .kc-h{display:none}.wn .kc-r{grid-template-columns:minmax(0,1fr) 44px 28px 28px 28px}.wn .kc-r .cn{grid-column:1/-1}.wn .kc-r.sub .cn{width:calc(100% - 18px)}

<div id="login" hidden>

</div>

const DEF_KINDS=[['char','성격',null,'mood',0],['look','외모',null,'look',1],['setting','설정',null,null,2],['job','직업·신분','setting','role',3],['age','나이대','setting','story',4],['past','과거 사연','setting','story',5]];

function rebuildKinds(){
  const top=KROWS.filter(k=>!k.parent||!KROWS.some(x=>x.code===k.parent)).sort((a,b)=>a.sort_order-b.sort_order),out=[];
  top.forEach(t=>{out.push([t.code,t.name,'',t]);KROWS.filter(x=>x.parent===t.code).sort((a,b)=>a.sort_order-b.sort_order).forEach(c=>out.push([c.code,t.name+' › '+c.name,'',c]))});
  KINDS.length=0;KINDS.push(...out);Object.keys(KN).forEach(k=>delete KN[k]);out.forEach(([k,n])=>KN[k]=n);
}
const kwInit=f=>Object.fromEntries(KINDS.map(([k])=>[k,f?f(k):[]]));

  const have=new Set(KROWS.map(k=>k.code)),add=[];
  if(!KROWS.length)DEF_KINDS.forEach(([code,name,parent,grp,sort_order])=>add.push({user_id:SES.user.id,code,name,parent,grp,sort_order}));
  const mx=Math.max(-1,...KROWS.map(k=>k.sort_order||0),...add.map(k=>k.sort_order));

  if(add.length)KROWS.push(...await db('POST','lvlv_kind','',add));

}

const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ',CHO1={'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ'};

/* 앱 크기: 창 높이에 꽉 차게(위아래 16px 여백) 정하고, 페이지 영역(두 쪽 또는 한 쪽)이 남은 높이·폭에 맞게 줄어들어요.
   앱 가로 = 목록 + 페이지 영역. 인물 정보 탭도 페이지 영역과 똑같은 크기. 이미지·글감 띠는 페이지 영역 바로 아래 */
const LAY={two:true,pw:600,ah:840};
function layout(){
  const d=$('#det'),wr=$('#dc .wrap'),ar=wr&&wr.querySelector('.area');if(!ar)return;
  const mob=innerWidth<=760,cs=getComputedStyle(d),padX=parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight),padY=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
  const avW=Math.max(200,mob?d.clientWidth-padX:innerWidth-34-$('#list').offsetWidth-padX),two=!mob&&avW>=760,n=two?2:1;
  const put=sc=>{const pw=Math.floor(PW*sc),cw=pw*n,ah=Math.round(pw*PH/PW);Object.assign(LAY,{two,pw,ah});
    wr.style.width=cw+'px';ar.style.width=cw+'px';ar.style.height=ah+'px';wr.classList.toggle('w2',two);wr.classList.toggle('wn',cw<520)};
  let sc=Math.min(1,avW/(n*PW));put(sc);
  const app=$('#app'),maxH=document.body.clientHeight-parseFloat(getComputedStyle(document.body).paddingTop)*2;app.style.height='';
  if(!mob)for(let k=0;k<3;k++){const used=wr.offsetHeight-ar.offsetHeight,avH=maxH-2-padY-used;   // 위 줄·띠 높이를 빼고 남은 높이
    const s2=Math.max(Math.min(avW,two?760:520)/(n*PW),Math.min(1,avW/(n*PW),avH/PH));   /* 너무 작아지지 않게: 한 쪽이면 폭 520px, 두 쪽이면 760px까지만 줄임 */if(Math.abs(s2-sc)<.001)break;sc=s2;put(sc)}
  if(!mob)app.style.height=Math.min(maxH,wr.offsetHeight+padY+2)+'px';   /* 앱 높이 = 내용 높이 (창보다 크면 창 높이) */
}

function fitQ(root){
  const qb=root.querySelector('.qb');if(!qb)return;const m=root.querySelector('.qm'),ps=[...qb.children],ok=()=>qb.scrollHeight<=qb.clientHeight+1;
  ps.forEach(p=>p.hidden=false);m.hidden=true;
  for(const f of [14,13,12,11]){qb.style.fontSize=f+'px';if(ok())return}
  m.hidden=false;let n=0;for(let i=ps.length-1;i>0&&!ok();i--){ps[i].hidden=true;n++;m.textContent=`외 ${n}개 · 눌러서 모두 보기`}
}

/* ---------- #키워드 블록 입력: 인물 키워드 / 외모 키워드. 같은 이름이 이미 있으면 그걸 쓰고, 없으면 저장할 때 새로 만들어요 ---------- */
const kwFind=(k,n)=>S.kwAll.find(x=>x.kind===k&&x.name.toLowerCase()===n.toLowerCase());
function tiDraw(){document.querySelectorAll('.ti').forEach(ti=>{const k=ti.dataset.k,inp=ti.querySelector('.ti-in');ti.querySelectorAll('.chip').forEach(x=>x.remove());
  S.kw[k].forEach(n=>inp.insertAdjacentHTML('beforebegin',`<span class="chip${kwFind(k,n)?'':' new'}" title="${kwFind(k,n)?'':'새 키워드 (저장하면 만들어져요)'}">#${E(n)}<b data-x="${k}|${E(n)}">✕</b></span>`))})}
function tiCommit(inp,final){
  const k=inp.dataset.k,raw=inp.value,parts=raw.split(/[\s,]+/),keep=final||/[\s,]$/.test(raw)?'':parts.pop();
  const n0=S.kw[k].length;
  parts.map(x=>x.replace(/^#+/,'').trim()).filter(Boolean).forEach(n=>{const ex=kwFind(k,n),name=ex?ex.name:n;if(!S.kw[k].some(v=>v.toLowerCase()===name.toLowerCase()))S.kw[k].push(name)});
  inp.value=keep;tiDraw();if(S.kw[k].length!==n0)kwChanged();
}
const commitAll=()=>document.querySelectorAll('.ti-in').forEach(i=>tiCommit(i,true));
const isTi=t=>t&&t.classList&&t.classList.contains('ti-in');
function fillDl(){$('#dls').innerHTML=KINDS.map(([k])=>`<datalist id="dl-${k}">`+S.kwAll.filter(x=>x.kind===k).map(x=>`<option value="${E(x.name)}">`).join('')+'</datalist>').join('')}
async function saveKw(cid){   // S.kw → lvlv_keyword(없으면 생성) + lvlv_char_keyword(연결)
  const need=[];
  for(const [k] of KINDS)for(const n of S.kw[k])if(!kwFind(k,n)&&!need.some(x=>x.kind===k&&x.name===n))need.push({kind:k,name:n,user_id:SES.user.id});
  if(need.length)S.kwAll.push(...await db('POST','lvlv_keyword','',need));
  const ids=[...new Set(KINDS.flatMap(([k])=>S.kw[k].map(n=>kwFind(k,n).id)))];
  await db('DELETE','lvlv_char_keyword',`?char_id=eq.${cid}`);
  if(ids.length)await db('POST','lvlv_char_keyword','',ids.map(keyword_id=>({char_id:cid,keyword_id,user_id:SES.user.id})));
  S.links=S.links.filter(l=>l.char_id!==cid).concat(ids.map(keyword_id=>({char_id:cid,keyword_id})));fillDl();
}

/* ---------- 인물 정보 자동 저장 (입력 후 0.8초) ---------- */
let it=null,saving=false,dirty=false,kwDirty=false,infoCid=null;
const readInfo=()=>{const c=cur();if(!c||!$('#f-name'))return;const n=$('#f-name').value.trim();if(n)c.name=n;c.origin=$('#f-origin').value.trim()||null;c.sex=$('#f-sex').dataset.v||null;if(hasFN())c.full_name=$('#f-full').value.trim()||null;c.quote=qLines($('#f-quote').value).join('\n')||null;c.profile=oneLine($('#f-profile').value)||null};
function infoDirty(){if(!S.edit||!$('#f-name'))return;readInfo();dirty=true;infoCid=S.cur;const v=$('#sv');if(v)v.textContent='저장 중…';clearTimeout(it);it=setTimeout(infoFlush,800)}
const kwChanged=()=>{kwDirty=true;infoDirty()};
const infoFlush=guard(async()=>{
  if(!dirty)return;clearTimeout(it);
  if(saving){it=setTimeout(infoFlush,300);return}
  const c=S.chars.find(x=>x.id===infoCid);if(!c){dirty=false;return}
  saving=true;dirty=false;const kd=kwDirty;kwDirty=false;
  try{
    await db('PATCH','lvlv_char',`?id=eq.${c.id}`,{name:c.name,origin:c.origin,sex:c.sex,quote:c.quote,profile:c.profile,...('full_name' in c?{full_name:c.full_name}:{}),updated_at:new Date().toISOString()});
    if(kd)await saveKw(c.id);
    sortChars();renderList();drawBoard();const n=$('.nn');if(n)n.textContent=c.name;const h=$('.hdr');if(h){let f=h.querySelector('.hfn');if(c.full_name){if(!f){n.insertAdjacentHTML('afterend','<span class="hfn"></span>');f=h.querySelector('.hfn')}f.textContent=c.full_name}else if(f)f.remove();layout();drawBoard()}const v=$('#sv');if(v)v.textContent='저장됨';
  }catch(e){dirty=true;if(kd)kwDirty=true;const v=$('#sv');if(v)v.textContent='저장 실패';throw e}
  finally{saving=false}
  if(dirty)infoFlush();
});

/* 썸네일 영역 고르기: 정사각형으로 잘라서(얼굴 클로즈업 등) 200px로 올리고, 원본은 따로 보관 */
function cropPick(file){
  return new Promise(res=>{
    const dlg=$('#cr'),img=$('#cr-img'),sel=$('#cr-sel'),box=$('#cr-box'),url=URL.createObjectURL(file);let q={x:0,y:0,s:0};
    const done=r=>{dlg.oncancel=null;URL.revokeObjectURL(url);if(dlg.open)dlg.close();res(r)};
    const paint=()=>{sel.style.cssText=`left:${q.x}px;top:${q.y}px;width:${q.s}px;height:${q.s}px`};
    img.onload=()=>{const W=img.clientWidth,H=img.clientHeight,s0=Math.min(W,H)*.7;q={x:(W-s0)/2,y:Math.max(0,(H-s0)*.25),s:s0};paint()};
    box.onpointerdown=ev=>{
      const W=img.clientWidth,H=img.clientHeight,rz=ev.target.id==='cr-rz';if(!rz&&ev.target.id!=='cr-sel')return;
      box.setPointerCapture(ev.pointerId);const x0=q.x,y0=q.y,s0=q.s,cx=ev.clientX,cy=ev.clientY;
      box.onpointermove=m=>{const dx=m.clientX-cx,dy=m.clientY-cy;
        if(rz)q.s=Math.max(30,Math.min(s0+Math.max(dx,dy),W-q.x,H-q.y));
        else{q.x=Math.max(0,Math.min(x0+dx,W-q.s));q.y=Math.max(0,Math.min(y0+dy,H-q.s))}
        paint()};
      box.onpointerup=()=>{box.onpointermove=box.onpointerup=null};
    };
    $('#cr-x').onclick=()=>done(null);$('#cr-full').onclick=()=>done({crop:null});dlg.oncancel=()=>done(null);
    $('#cr-ok').onclick=async()=>{try{
      const bmp=await createImageBitmap(file,{imageOrientation:'from-image'}),k=bmp.width/img.clientWidth,sz=Math.max(1,Math.round(q.s*k)),c=document.createElement('canvas');
      c.width=c.height=sz;c.getContext('2d').drawImage(bmp,q.x*k,q.y*k,q.s*k,q.s*k,0,0,sz,sz);bmp.close();
      const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.95));done({crop:new File([blob],'crop.jpg',{type:'image/jpeg'})});
    }catch(e){toast('이미지를 읽을 수 없어요');done(null)}};
    img.src=url;dlg.showModal();
  });
}
async function saveImg(file,id,pre){   // 자른 영역(또는 전체)을 200px WebP로 R2에, 원본은 폴더(PC) 또는 서버 inbox에
  const r=pre||await cropPick(file);if(!r)return null;toast('올리는 중…');
  const p=await Media.process(r.crop||file);let hash;try{hash=await Media.upload(p)}finally{p.close()}
  let original='failed',err='';try{original=await Media.original(id,file)}catch(e){err=e.message}
  return {hash,original,err};
}
const addFiles=guard(async files=>{
  const fs=[...files].filter(f=>f.type.startsWith('image/'));
  for(const f of fs){
    const id=Media.newId(),x=await saveImg(f,id);if(!x)continue;
    const r=await db('POST','lvlv_image','',{id,char_id:S.cur,user_id:SES.user.id,image:x.hash,sort_order:S.imgs.length});S.imgs.push(r[0]);
    if(x.original==='failed')toast('원본 보관에 실패했어요: '+x.err);

});

/* ---------- 스크랩북: 1쪽은 자동 생성, 2쪽부터 자유 배치 (PC는 두 쪽씩 펼침) ---------- */
const PW=600,PH=840;
let bsel=null,bt,bpg=0;
const maxZ=b=>Math.max(0,...b.items.map(o=>o.z||0));
const bget=c=>{let b=c.board;if(!b||Array.isArray(b))b=c.board={n:2,items:Array.isArray(b)?b:[]};b.items.forEach(o=>{if(!o.p)o.p=1});b.n=Math.max(2,b.n||2,...b.items.map(o=>o.p+1));return b};
const bsave=()=>{clearTimeout(bt);bt=setTimeout(guard(async()=>{const c=cur();if(c)await db('PATCH','lvlv_char',`?id=eq.${c.id}`,{board:c.board})}),700)};
const stepOf=()=>(LAY.two?2:1);
function drawBoard(){
  const c=cur(),w=$('#sbw');if(!c||!w)return;
  const b=bget(c);b.items=b.items.filter(o=>o.k==='t'||(o.k==='i'?S.imgs.some(x=>x.id===o.ref):S.texts.some(t=>t.id===o.ref)));
  const two=LAY.two,pw=LAY.pw,s=pw/PW,st=two?2:1;
  bpg=Math.max(0,Math.min(Math.floor(bpg/st)*st,Math.floor((b.n-1)/st)*st));
  const sb=$('#sb'),ps=two?[bpg,bpg+1]:[bpg];sb.className='sb'+(two?' two':'')+(S.edit?' ed':'');sb.innerHTML='';
  ps.forEach((pi,k)=>{
    const pg=document.createElement('div');pg.className='pg'+(two?(k?' r':' l'):'')+(pi>=b.n?' blank':'');pg.style.cssText=`width:${pw}px;height:${LAY.ah}px`;
    if(pi<b.n){const inn=document.createElement('div');inn.className='pgi';inn.style.transform=`scale(${s})`;
      if(pi===0)inn.innerHTML=firstPage(c);else b.items.filter(o=>o.p===pi).forEach(o=>inn.appendChild(itemEl(o,s,b)));pg.appendChild(inn)}
    sb.appendChild(pg);if(pi===0&&pi<b.n)fitQ(pg);
  });
  $('#pn').textContent=`${ps.filter(p=>p<b.n).map(p=>p+1).join('–')} / ${b.n}쪽`;
}
function itemEl(o,s,b){
  const e=document.createElement('div');e.className=`it ${o.k} c${parseInt(o.id.slice(0,2),16)%3}${bsel===o.id&&S.edit?' sel':''}`;
  e.style.cssText=`left:${o.x}px;top:${o.y}px;width:${o.w}px;z-index:${o.z||1};transform:rotate(${o.r||0}deg)`;
  if(o.k==='i')e.innerHTML=`<img src="${Media.url(S.imgs.find(x=>x.id===o.ref).image)}" alt="">`;
  else if(o.k==='q'){const t=S.texts.find(x=>x.id===o.ref);e.innerHTML=`<p>${E(t.body)}</p>${t.source?`<small>${E(t.source)}</small>`:''}`}
  else{e.innerHTML=`<p contenteditable="${S.edit?'plaintext-only':'false'}">${E(o.t||'')}</p>`;e.firstChild.oninput=()=>{o.t=e.firstChild.textContent;bsave()}}
  e.ondblclick=()=>{if(o.k==='i')openImg(o.ref)};
  if(!S.edit)return e;   // 감상 모드: 고정
  e.insertAdjacentHTML('beforeend','<i class="rz"></i>');
  e.onpointerdown=ev=>{
    if(ev.target.className==='rz')return resize(ev,o,e,s);
    if(o.k==='t'&&ev.target.tagName==='P')return;
    bsel=o.id;$('#sb').querySelectorAll('.it').forEach(x=>x.classList.toggle('sel',x===e));
    o.z=maxZ(b)+1;e.style.zIndex=o.z;
    const x0=o.x,y0=o.y,cx=ev.clientX,cy=ev.clientY;e.setPointerCapture(ev.pointerId);
    e.onpointermove=m=>{o.x=Math.min(PW-40,Math.max(40-o.w,Math.round(x0+(m.clientX-cx)/s)));o.y=Math.min(PH-40,Math.max(0,Math.round(y0+(m.clientY-cy)/s)));e.style.left=o.x+'px';e.style.top=o.y+'px'};
    e.onpointerup=()=>{e.onpointermove=e.onpointerup=null;bsave()};
  };
  return e;
}
function resize(ev,o,e,s){
  ev.stopPropagation();e.setPointerCapture(ev.pointerId);const w0=o.w,x0=ev.clientX;
  const mv=m=>{o.w=Math.max(80,Math.round(w0+(m.clientX-x0)/s));e.style.width=o.w+'px'};
  const up=()=>{e.removeEventListener('pointermove',mv);e.removeEventListener('pointerup',up);bsave()};
  e.addEventListener('pointermove',mv);e.addEventListener('pointerup',up);
}
function addBoard(k,ref){   // 1쪽은 자동 페이지라 2쪽부터 붙음
  const c=cur(),b=bget(c),p=bpg||1,n=b.items.filter(o=>o.p===p).length;
  const o={id:crypto.randomUUID(),k,ref:ref||null,p,x:30+(n*28)%300,y:30+(n*22)%260,w:k==='i'?170:k==='q'?220:190,r:((n*7)%9)-4,z:maxZ(b)+1};
  if(k==='t')o.t='';b.items.push(o);bsel=o.id;if(stepOf()===1)bpg=p;drawBoard();bsave();
}
function boardAct(a){
  const c=cur(),b=bget(c),o=b.items.find(x=>x.id===bsel);if(!o)return toast('페이지에서 오브젝트를 먼저 눌러 선택하세요');
  if(a==='rl')o.r=(o.r||0)-5;if(a==='rr')o.r=(o.r||0)+5;if(a==='sm')o.w=Math.max(80,Math.round(o.w*.9));if(a==='bg')o.w=Math.round(o.w*1.1);
  if(a==='fr')o.z=maxZ(b)+1;
  if(a==='pl'||a==='pr'){o.p=Math.min(b.n-1,Math.max(1,o.p+(a==='pr'?1:-1)));bpg=o.p}
  if(a==='rm'){b.items=b.items.filter(x=>x!==o);bsel=null}
  drawBoard();bsave();
}
function pageAct(a){
  const c=cur(),b=bget(c);
  if(a==='add'){b.n++;bpg=b.n-1}
  else if(a==='del'){
    const last=b.n-1;if(b.n<=2)return toast('첫 페이지와 빈 페이지 하나는 있어야 해요');
    if(b.items.some(o=>o.p===last)&&!confirm('마지막 페이지의 오브젝트가 모두 사라져요. 계속할까요?'))return;
    b.items=b.items.filter(o=>o.p!==last);b.n--;
  }else bpg+=(+a)*stepOf();
  drawBoard();if(a==='add'||a==='del')bsave();
}

const keep=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
document.addEventListener('click',guard(async e=>{
  const t=e.target,g=s=>t.closest(s);

/* ---------- 키워드 관리: 종류별 목록 · 이름 바꾸기 · 종류 옮기기 · 합치기 · 삭제 ---------- */
async function kwUpdate(id,patch){
  const k=S.kwAll.find(x=>x.id===id),kind=patch.kind??k.kind,name=String(patch.name??k.name).trim().replace(/^#+/,'');
  if(!name)throw new Error('이름이 비었어요');
  if(kind===k.kind&&name===k.name)return;
  const same=S.kwAll.find(x=>x.id!==id&&x.kind===kind&&x.name.toLowerCase()===name.toLowerCase());
  if(!same){const r=await db('PATCH','lvlv_keyword',`?id=eq.${id}`,{kind,name});Object.assign(k,r[0]);return}
  if(!confirm(`'${same.name}' (${KN[kind]||kind}) 키워드가 이미 있어요. 하나로 합칠까요?`))return;
  await kwMerge(id,same.id);
}
/* 합치기: id 키워드에 걸린 인물을 모두 toId로 옮기고(이미 걸려 있으면 그대로), id 키워드는 지워요 */
async function kwMerge(id,toId){
  const have=new Set(S.links.filter(l=>l.keyword_id===toId).map(l=>l.char_id)),mv=S.links.filter(l=>l.keyword_id===id&&!have.has(l.char_id));
  if(mv.length)await db('POST','lvlv_char_keyword','',mv.map(l=>({char_id:l.char_id,keyword_id:toId,user_id:SES.user.id})));
  await db('DELETE','lvlv_char_keyword',`?keyword_id=eq.${id}`);await db('DELETE','lvlv_keyword',`?id=eq.${id}`);
  S.links=S.links.filter(l=>l.keyword_id!==id).concat(mv.map(l=>({char_id:l.char_id,keyword_id:toId})));S.kwAll=S.kwAll.filter(x=>x.id!==id);
  return mv.length;
}
const kindOpts=sel=>KINDS.map(([v,vn])=>`<option value="${v}"${v===sel?' selected':''}>${E(vn)}</option>`).join('');
function renderKm(){
  const box=$('#km-b'),sc=[...box.querySelectorAll('.ipc')].map(e=>e.scrollTop);
  const cnt={},kcnt={};S.links.forEach(l=>cnt[l.keyword_id]=(cnt[l.keyword_id]||0)+1);S.kwAll.forEach(x=>kcnt[x.kind]=(kcnt[x.kind]||0)+1);
  const tops=KROWS.filter(k=>!k.parent||!KROWS.some(x=>x.code===k.parent));
  const catRow=(k,sub)=>{const hasCh=KROWS.some(x=>x.parent===k.code);
    return `<div class="kc-r${sub?' sub':''}" data-cid="${k.code}"><input class="cn" value="${E(k.name)}" title="분류 이름"><select class="cp"${hasCh?' disabled title="하위 분류가 있어서 옮길 수 없어요"':' title="위치"'}><option value="">맨 위</option>${tops.filter(t=>t.code!==k.code).map(t=>`<option value="${t.code}"${t.code===k.parent?' selected':''}>${E(t.name)} 아래</option>`).join('')}</select><small class="mut">${kcnt[k.code]||0}개</small><button class="mv" data-cm="${k.code}|-1" title="위로">▲</button><button class="mv" data-cm="${k.code}|1" title="아래로">▼</button><button class="mv x" data-cd="${k.code}" title="분류 삭제">✕</button></div>`};
  const left=`<div class="ipc"><div class="ih"><b>분류</b><small class="mut">성격·외모·설정 말고도 자유롭게 만들 수 있어요</small></div>
    <div class="kc-h"><span>이름</span><span>위치</span><span style="text-align:right">키워드</span><span></span><span></span><span></span></div>
    ${KINDS.map(([k,n,_,r])=>catRow(r,!!(r.parent&&KROWS.some(x=>x.code===r.parent)))).join('')}
    <div class="kc-add"><input id="ca-n" placeholder="새 분류 이름"><button id="ca">＋ 분류 추가</button></div></div>`;
  const mgRow=x=>`<div class="mg-r"><span>‘${E(x.name)}’ ${cnt[x.id]||0}명을</span><select id="mg-to"><option value="">합칠 키워드 고르기</option>${KINDS.map(([k,n])=>{const o=S.kwAll.filter(y=>y.kind===k&&y.id!==x.id).sort((a,b)=>a.name.localeCompare(b.name,'ko'));return o.length?`<optgroup label="${E(n)}">${o.map(y=>`<option value="${y.id}">${E(y.name)} (${cnt[y.id]||0}명)</option>`).join('')}</optgroup>`:''}).join('')}</select><span>에 합치기</span><button class="p" data-mgo="${x.id}">합치기</button><button data-mgx>취소</button></div>`;
  const right=`<div class="ipc"><div class="ih"><b>키워드</b><small class="mut">${S.kwAll.length}개</small><input id="kq" placeholder="키워드 찾기" value="${E(S.kq||'')}"></div>`+KINDS.map(([k,n])=>{const L=S.kwAll.filter(x=>x.kind===k).sort((a,b)=>a.name.localeCompare(b.name,'ko'));
    return `<div class="ks"><div class="ks-h">${E(n)} <small class="mut">${L.length}개</small></div>`+(L.map(x=>`<div class="kr" data-kid="${x.id}" data-n="${E(x.name.toLowerCase())}"><input class="kn" value="${E(x.name)}" title="이름 (같은 분류에 같은 이름이 있으면 합칠지 물어봐요)"><select class="kk" title="분류 옮기기">${kindOpts(x.kind)}</select><select class="kc" title="다른 분류에도 걸기"><option value="">＋ 다른 분류</option>${KINDS.filter(([v])=>v!==x.kind).map(([v,vn])=>`<option value="${v}">${E(vn)}</option>`).join('')}</select><small class="mut">${cnt[x.id]||0}명</small><button class="mv" data-mg="${x.id}" title="다른 키워드와 합치기">⇄</button><button class="mv x" data-kd="${x.id}" title="삭제">✕</button></div>`+(S.mg===x.id?mgRow(x):'')).join('')||'<small class="mut">없어요</small>')+'</div>'}).join('')+'</div>';
  box.innerHTML=left+right;box.querySelectorAll('.ipc').forEach((e,i)=>e.scrollTop=sc[i]||0);kqFilter();
}
function kqFilter(){const q=(S.kq||'').trim().toLowerCase(),box=$('#km-b');
  box.querySelectorAll('.kr').forEach(r=>r.hidden=!!q&&!r.dataset.n.includes(q));
  box.querySelectorAll('.ks').forEach(k=>k.hidden=!!q&&!k.querySelector('.kr:not([hidden])'))}
$('#km-b').addEventListener('input',e=>{if(e.target.id==='kq'){S.kq=e.target.value;kqFilter()}});
async function kwCopy(id,toKind){
  const k=S.kwAll.find(x=>x.id===id);let t=S.kwAll.find(x=>x.kind===toKind&&x.name.toLowerCase()===k.name.toLowerCase());
  if(!t){t=(await db('POST','lvlv_keyword','',{kind:toKind,name:k.name,user_id:SES.user.id}))[0];S.kwAll.push(t)}
  const have=new Set(S.links.filter(l=>l.keyword_id===t.id).map(l=>l.char_id)),add=S.links.filter(l=>l.keyword_id===id&&!have.has(l.char_id));
  if(add.length)await db('POST','lvlv_char_keyword','',add.map(l=>({char_id:l.char_id,keyword_id:t.id,user_id:SES.user.id})));
  S.links=S.links.concat(add.map(l=>({char_id:l.char_id,keyword_id:t.id})));
}
async function kindPatch(code,patch){const r=await db('PATCH','lvlv_kind',`?code=eq.${encodeURIComponent(code)}`,patch);Object.assign(KROWS.find(x=>x.code===code),r[0]);rebuildKinds()}
$('#kmb').onclick=guard(async()=>{S.mg=null;renderKm();await openPanel('km')});
$('#km-b').addEventListener('change',guard(async e=>{
  const t=e.target,cr=t.closest('.kc-r'),r=t.closest('.kr');
  if(t.id==='ca-n'||t.id==='kq'||t.id==='mg-to')return;
  if(cr&&cr.dataset.cid){const code=cr.dataset.cid;
    if(t.classList.contains('cn')){const v=t.value.trim();if(v)await kindPatch(code,{name:v})}
    else if(t.classList.contains('cp')){const p=t.value||null,sibs=KROWS.filter(x=>x.parent===p&&x.code!==code);await kindPatch(code,{parent:p,sort_order:Math.max(-1,...sibs.map(x=>x.sort_order||0))+1})}
  }else if(r){const id=r.dataset.kid;
    if(t.classList.contains('kn'))await kwUpdate(id,{name:t.value});
    else if(t.classList.contains('kk'))await kwUpdate(id,{kind:t.value});
    else if(t.classList.contains('kc')&&t.value)await kwCopy(id,t.value);
  }
  renderKm();renderList();
}));
$('#km-b').addEventListener('click',guard(async e=>{
  const b=e.target.closest('[data-kd],[data-cd],[data-cm],[data-mg],[data-mgo],[data-mgx],#ca');if(!b)return;
  if(b.dataset.mg){S.mg=S.mg===b.dataset.mg?null:b.dataset.mg;renderKm();const m=$('#mg-to');if(m)m.focus();return}
  if(b.hasAttribute('data-mgx')){S.mg=null;return renderKm()}
  if(b.dataset.mgo){const id=b.dataset.mgo,to=$('#mg-to').value,a=S.kwAll.find(x=>x.id===id),z=S.kwAll.find(x=>x.id===to);if(!z)return toast('합칠 키워드를 골라 주세요');
    const n=S.links.filter(l=>l.keyword_id===id).length;
    if(!confirm(`‘${a.name}’(${KN[a.kind]||a.kind})을 ‘${z.name}’(${KN[z.kind]||z.kind})에 합칠까요?\n‘${a.name}’이 걸린 ${n}명은 ‘${z.name}’으로 옮겨지고, ‘${a.name}’은 없어져요.`))return;
    const mv=await kwMerge(id,to);S.mg=null;renderKm();renderList();return toast(`합쳤어요 · ${n}명 중 ${mv}명을 새로 연결했어요 (나머지는 이미 연결돼 있었어요)`)}
  if(b.id==='ca'){const n=$('#ca-n').value.trim();if(!n)return;
    const code='k_'+crypto.randomUUID().slice(0,8),r=await db('POST','lvlv_kind','',{user_id:SES.user.id,code,name:n,parent:null,grp:null,sort_order:Math.max(-1,...KROWS.map(x=>x.sort_order||0))+1});
    KROWS.push(r[0]);rebuildKinds();renderKm();return}
  if(b.dataset.cm){const [code,d]=b.dataset.cm.split('|'),me=KROWS.find(x=>x.code===code),sibs=KROWS.filter(x=>(x.parent||null)===(me.parent||null)).sort((a,b)=>a.sort_order-b.sort_order),i=sibs.indexOf(me),o=sibs[i+(+d)];if(!o)return;
    const a=me.sort_order,c=o.sort_order;if(a===c){sibs.forEach((x,j)=>x.sort_order=j);}
    const x1=me.sort_order,x2=o.sort_order;await kindPatch(code,{sort_order:x2});await kindPatch(o.code,{sort_order:x1});
    if(x1===x2){KROWS.sort((p,q)=>p.sort_order-q.sort_order)}renderKm();return}
  if(b.dataset.cd){const code=b.dataset.cd,k=KROWS.find(x=>x.code===code);
    if(KROWS.some(x=>x.parent===code))return toast('하위 분류가 있어요. 먼저 옮기거나 지워 주세요');
    const n=S.kwAll.filter(x=>x.kind===code).length;if(n)return toast(`이 분류에 키워드 ${n}개가 있어요. 먼저 다른 분류로 옮기거나 지워 주세요`);
    if(!confirm(`'${k.name}' 분류를 삭제할까요?`))return;
    await db('DELETE','lvlv_kind',`?code=eq.${encodeURIComponent(code)}`);KROWS=KROWS.filter(x=>x.code!==code);rebuildKinds();renderKm();return}
  const id=b.dataset.kd,k=S.kwAll.find(x=>x.id===id),n=S.links.filter(l=>l.keyword_id===id).length;
  if(!confirm(n?`'${k.name}' 키워드를 ${n}명에게서 떼고 삭제할까요?`:`'${k.name}' 키워드를 삭제할까요?`))return;
  await db('DELETE','lvlv_char_keyword',`?keyword_id=eq.${id}`);await db('DELETE','lvlv_keyword',`?id=eq.${id}`);
  S.links=S.links.filter(l=>l.keyword_id!==id);S.kwAll=S.kwAll.filter(x=>x.id!==id);renderKm();renderList();
}));
